<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>강동자바라 용달비 계산기</title>
  <style>
    :root{--blue:#1769e0;--navy:#12325b;--bg:#f3f6fb;--line:#dbe4f0;--text:#172033;--sub:#667085;--white:#fff}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:720px;margin:0 auto;padding:18px}
    .hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:24px;border-radius:22px;box-shadow:0 12px 30px rgba(23,105,224,.18)}
    .hero h1{font-size:26px;margin:0 0 8px}.hero p{margin:0;opacity:.9;line-height:1.55}
    .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 8px 22px rgba(20,40,80,.06)}
    .step{font-size:13px;color:var(--blue);font-weight:800;margin-bottom:7px}.label{font-size:18px;font-weight:800;margin-bottom:10px}
    select{width:100%;height:54px;border:1px solid #cbd5e1;border-radius:14px;padding:0 14px;font-size:17px;background:#fff;color:#111827;outline:none}
    select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,224,.12)}
    .grid{display:grid;gap:14px}
    .result{display:none;text-align:center;background:#eff6ff;border:2px solid #93c5fd;border-radius:20px;padding:22px;margin-top:18px}
    .result .small{font-size:14px;color:#475467}.result .price{font-size:40px;font-weight:900;color:#0f5bc4;margin:8px 0}.result .won{font-size:19px;font-weight:800}
    .detail{margin-top:12px;font-size:14px;line-height:1.65;color:#475467;background:#fff;border-radius:12px;padding:12px}
    .notice{font-size:13px;color:#667085;line-height:1.6;margin-top:14px}
    .reset{width:100%;height:48px;margin-top:14px;border:0;border-radius:13px;background:#e9eef6;color:#344054;font-weight:800;font-size:15px;cursor:pointer}
    .footer{text-align:center;color:#98a2b3;font-size:12px;padding:18px 0 8px}
    @media(min-width:640px){.grid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>용달비 간편 계산기</h1>
    <p>경기도 지역과 차량을 선택하면 사진 요금표 기준 예상 운임을 바로 확인할 수 있습니다.</p>
  </section>

  <section class="card">
    <div class="grid">
      <div>
        <div class="step">STEP 1</div>
        <div class="label">지역 구분</div>
        <select id="province">
          <option value="">지역을 선택하세요</option>
          <option value="gyeonggi">경기도</option>
        </select>
      </div>
      <div>
        <div class="step">STEP 2</div>
        <div class="label">세부 지역</div>
        <select id="region" disabled>
          <option value="">세부 지역을 선택하세요</option>
        </select>
      </div>
      <div class="full">
        <div class="step">STEP 3</div>
        <div class="label">차량 종류</div>
        <select id="vehicle" disabled>
          <option value="">차량을 선택하세요</option>
        </select>
      </div>
    </div>

    <div id="result" class="result">
      <div class="small">예상 용달 운임</div>
      <div class="price"><span id="manwon">0</span><span class="won">만원</span></div>
      <div id="won" class="won">0원</div>
      <div id="detail" class="detail"></div>
    </div>
    <button id="reset" class="reset" type="button">다시 선택</button>
    <div class="notice">※ 제공하신 요금표 사진을 기준으로 만든 간편 계산기입니다.<br>※ 부가세, 상·하차 대기, 왕복, 톨게이트, 야간·휴일, 현장 진입 조건에 따라 추가 비용이 발생할 수 있습니다.</div>
  </section>
  <div class="footer">강동자바라 용달비 계산기</div>
</div>
<script>
const vehicles=['다마스','라보','1톤','1.4톤','2.5톤','3.5톤','5톤','5톤플러스','5톤축','11톤','18톤','25톤'];

// 단위: 만원. 사진 요금표의 경기도 구간을 같은 요금끼리 묶었습니다.
const gyeonggi=[
 {name:'군내 10km 이내', prices:[2,2.5,3,4,5.5,6.5,7.5,8.5,9,12,15,17]},
 {name:'군내 20km 이내', prices:[2.5,3,3.5,4.5,6,7,8,9,10,13,16,18]},
 {name:'성남·야탑·율현 인근', prices:[2.5,3,4,5,6.5,7.5,9,10,11,14,17,19]},
 {name:'이천·용인 모현·구리 갈매 인근', prices:[3,3.5,4.5,5.5,7,8,10,11,12,14,18,20]},
 {name:'이천 남부·여주·가남 인근', prices:[3.5,4,5,6,8,9,11,12,13,16,19,21]},
 {name:'화성·오산·김포·남양주·수원·안양권', prices:[4,4.5,5.5,7,9,10,12,13,14,17,20,23]},
 {name:'남양주 외곽·용인 외곽·안성권', prices:[4.5,5,6,7.5,10,11,13,14,15,18,22,25]},
 {name:'안성·모현·부천·시흥·안산·화성권', prices:[5,5.5,7,8,11,12,14,15,16,19,23,27]},
 {name:'고양·화정·송산·서울 북부 인근', prices:[5.5,6,7.5,8.5,12,13,15,16,17,20,24,28]},
 {name:'양주·고양 서부·파주·운정·가평권', prices:[6,6.5,8,9.5,13,14,16,17,18,21,25,29]},
 {name:'포천권', prices:[7,7.5,9,11,14,15,17,18,20,23,27,31]},
 {name:'연천권', prices:[8,8.5,10,12,16,17,19,20,22,25,29,33]}
];

const province=document.getElementById('province');
const region=document.getElementById('region');
const vehicle=document.getElementById('vehicle');
const result=document.getElementById('result');

province.addEventListener('change',()=>{
  region.innerHTML='<option value="">세부 지역을 선택하세요</option>';
  vehicle.innerHTML='<option value="">차량을 선택하세요</option>';
  vehicle.disabled=true; result.style.display='none';
  if(province.value==='gyeonggi'){
    gyeonggi.forEach((r,i)=>region.insertAdjacentHTML('beforeend',`<option value="${i}">${r.name}</option>`));
    region.disabled=false;
  }else region.disabled=true;
});

region.addEventListener('change',()=>{
  vehicle.innerHTML='<option value="">차량을 선택하세요</option>';
  result.style.display='none';
  if(region.value!==''){
    vehicles.forEach((v,i)=>vehicle.insertAdjacentHTML('beforeend',`<option value="${i}">${v}</option>`));
    vehicle.disabled=false;
  }else vehicle.disabled=true;
});

vehicle.addEventListener('change',()=>{
  if(vehicle.value===''){result.style.display='none';return;}
  const r=gyeonggi[Number(region.value)];
  const v=vehicles[Number(vehicle.value)];
  const p=r.prices[Number(vehicle.value)];
  document.getElementById('manwon').textContent=p.toLocaleString('ko-KR');
  document.getElementById('won').textContent=(p*10000).toLocaleString('ko-KR')+'원';
  document.getElementById('detail').innerHTML=`경기도 · ${r.name}<br>${v} 차량 기준`;
  result.style.display='block';
  result.scrollIntoView({behavior:'smooth',block:'nearest'});
});

document.getElementById('reset').addEventListener('click',()=>{
  province.value=''; region.innerHTML='<option value="">세부 지역을 선택하세요</option>'; region.disabled=true;
  vehicle.innerHTML='<option value="">차량을 선택하세요</option>'; vehicle.disabled=true; result.style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
