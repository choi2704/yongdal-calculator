<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>강동자바라 전국 용달비 계산기</title>
<style>
:root{--blue:#1769e0;--navy:#11335c;--bg:#f3f6fb;--line:#d9e2ee;--text:#172033;--sub:#667085}
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:780px;margin:auto;padding:18px}.hero{padding:25px;border-radius:22px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;box-shadow:0 12px 30px rgba(23,105,224,.18)}
h1{font-size:26px;margin:0 0 8px}.hero p{margin:0;line-height:1.55;opacity:.92}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 8px 22px rgba(20,40,80,.06)}
.grid{display:grid;gap:14px}.step{font-size:13px;font-weight:800;color:var(--blue);margin-bottom:7px}.label{font-size:18px;font-weight:800;margin-bottom:10px}
select,input{width:100%;height:54px;border:1px solid #cbd5e1;border-radius:14px;padding:0 14px;font-size:16px;background:#fff;color:#111827;outline:none}select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,224,.12)}
.result{display:none;text-align:center;background:#eff6ff;border:2px solid #93c5fd;border-radius:20px;padding:22px;margin-top:18px}.small{font-size:14px;color:#475467}.price{font-size:40px;font-weight:900;color:#0f5bc4;margin:8px 0}.won{font-size:19px;font-weight:800}.detail{margin-top:12px;font-size:14px;line-height:1.7;color:#475467;background:#fff;border-radius:12px;padding:12px}.notice{font-size:13px;color:var(--sub);line-height:1.65;margin-top:14px}.reset{width:100%;height:48px;margin-top:14px;border:0;border-radius:13px;background:#e9eef6;color:#344054;font-weight:800;font-size:15px;cursor:pointer}.footer{text-align:center;color:#98a2b3;font-size:12px;padding:18px 0 8px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
</style>
</head>
<body><div class="wrap">
<section class="hero"><h1>전국 용달비 간편 계산기</h1><p>경기 광주 출발 요금표 기준입니다.<br>권역 → 지역 → 차량을 선택하세요.</p></section>
<section class="card"><div class="grid">
<div><div class="step">STEP 1</div><div class="label">권역 선택</div><select id="province"><option value="">권역을 선택하세요</option></select></div>
<div><div class="step">STEP 2</div><div class="label">세부 지역</div><select id="region" disabled><option value="">세부 지역을 선택하세요</option></select></div>
<div class="full"><div class="step">STEP 3</div><div class="label">차량 종류</div><select id="vehicle" disabled><option value="">차량을 선택하세요</option></select></div>
</div>
<div id="result" class="result"><div class="small">요금표 기준 예상 운임</div><div class="price"><span id="manwon">0</span><span class="won">만원</span></div><div id="won" class="won">0원</div><div id="detail" class="detail"></div></div>
<button id="reset" class="reset">다시 선택</button>
<div class="notice">※ 사진으로 제공된 요금표를 그대로 입력한 참고 금액입니다.<br>※ 거리, 교통상황, 부가세, 톨게이트, 상·하차 대기, 왕복, 야간·휴일 및 현장 조건에 따라 추가 운임이 발생할 수 있습니다.</div>
</section><div class="footer">강동자바라 전국 용달비 계산기</div></div>
<script>
const vehicles=['다마스','라보','1톤','1.4톤','2.5톤','3.5톤','5톤','5톤플','5톤축','11톤','18톤','25톤'];
const data={

['구미·군위·성주·의성·칠곡',[12,13,14,16,20,21,23,25,27,31,35,39]],
['대구·청송',[14,15,16,18,23,24,26,28,30,35,40,44]],

['고성·김해·양산·울산·의령',[18,19,20,22,27,29,33,35,37,42,46,51]],

};
const province=document.getElementById('province'),region=document.getElementById('region'),vehicle=document.getElementById('vehicle'),result=document.getElementById('result');
Object.keys(data).forEach(k=>province.insertAdjacentHTML('beforeend',`<option value="${k}">${k}</option>`));
province.onchange=()=>{region.innerHTML='<option value="">세부 지역을 선택하세요</option>';vehicle.innerHTML='<option value="">차량을 선택하세요</option>';vehicle.disabled=true;result.style.display='none';if(province.value){data[province.value].forEach((r,i)=>region.insertAdjacentHTML('beforeend',`<option value="${i}">${r[0]}</option>`));region.disabled=false}else region.disabled=true};
region.onchange=()=>{vehicle.innerHTML='<option value="">차량을 선택하세요</option>';result.style.display='none';if(region.value!==''){vehicles.forEach((v,i)=>vehicle.insertAdjacentHTML('beforeend',`<option value="${i}">${v}</option>`));vehicle.disabled=false}else vehicle.disabled=true};
vehicle.onchange=()=>{if(vehicle.value===''){result.style.display='none';return}const r=data[province.value][+region.value],v=vehicles[+vehicle.value],p=r[1][+vehicle.value];manwon.textContent=p.toLocaleString('ko-KR');won.textContent=(p*10000).toLocaleString('ko-KR')+'원';detail.innerHTML=`출발: 경기 광주<br>도착: ${province.value} · ${r[0]}<br>차량: ${v}`;result.style.display='block';result.scrollIntoView({behavior:'smooth',block:'nearest'})};
reset.onclick=()=>{province.value='';region.innerHTML='<option value="">세부 지역을 선택하세요</option>';region.disabled=true;vehicle.innerHTML='<option value="">차량을 선택하세요</option>';vehicle.disabled=true;result.style.display='none';scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
